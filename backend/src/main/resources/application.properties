spring.application.name=smart-parking-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_parking
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# users.password is added as a nullable BCrypt hash column so existing rows are not dropped.
# Existing users without a password cannot log in; register again or recreate them.

# Server
server.port=8080

# JWT (override JWT_SECRET in local environment; do not commit real secrets)
app.jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-secret-key-32}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI-1 Python occupancy service (Flask @ port 5000)
app.ai1.base-url=${AI1_BASE_URL:http://localhost:5000}
app.ai1.timeout-ms=${AI1_TIMEOUT_MS:5000}
# Creates parking area id=1 with slots A01-A69 when missing (skips if id=1 conflicts)
app.ai1.demo-bootstrap.enabled=${AI1_DEMO_BOOTSTRAP_ENABLED:true}

# AI-2 Python recommendation service (Flask @ port 5001)
app.ai2.base-url=${AI2_BASE_URL:http://localhost:5001}
app.ai2.timeout-ms=${AI2_TIMEOUT_MS:5000}