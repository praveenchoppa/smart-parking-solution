spring.application.name=smart-parking-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_parking
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# users.password is added as a nullable BCrypt hash column so existing rows are not dropped.
# Existing users without a password cannot log in; register again or recreate them.

# Server
server.port=8080

# JWT (override JWT_SECRET in local environment; do not commit real secrets)
app.jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-secret-key-32}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}