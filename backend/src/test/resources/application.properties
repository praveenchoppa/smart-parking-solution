spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=dev-only-change-this-jwt-secret-key-32
app.jwt.expiration-ms=86400000

app.ai1.base-url=http://localhost:5000
app.ai1.timeout-ms=5000
app.ai1.scheduled-sync.enabled=false
app.ai1.scheduled-sync-interval-ms=15000
app.ai1.demo-bootstrap.enabled=false

app.ai2.base-url=http://localhost:5001
app.ai2.timeout-ms=5000

app.ai3.base-url=http://localhost:5002
app.ai3.timeout-ms=5000
